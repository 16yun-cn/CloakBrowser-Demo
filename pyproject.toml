[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloakbrowser-demo"
version = "0.1.0"
description = "CloakBrowser demo — doubao.com automation with CAPTCHA solving"
requires-python = ">=3.10"
dependencies = [
    "cloakbrowser",
    "playwright",
    "tomli; python_version < '3.11'",
    "hatchling",
    "httpx[socks]",
    "rich>=15.0.0",
]

[project.scripts]
doubao = "runner:main"
doubao-concurrent = "orchestrator:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.uv.sources]
cloakbrowser = { path = "CloakBrowser" }

[tool.hatch.build.targets.wheel]
packages = ["src/captcha"]

[tool.hatch.build.force-include]
"src/config.py" = "config.py"
"src/runner.py" = "runner.py"
"src/orchestrator.py" = "orchestrator.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle
    "I",                  # isort
    "UP",                 # pyupgrade
    "B",                  # flake8-bugbear
    "C4",                 # flake8-comprehensions
    "SIM",                # flake8-simplify
]
ignore = []
exclude = ["scripts/**"]

[tool.ruff.lint.per-file-ignores]
# CAPTCHA_PROMPT is a long LLM prompt — splitting hurts readability
"src/captcha/recognizer.py" = ["E501"]
# SIM108 ternary would be less readable here
"src/config.py" = ["SIM108"]

[tool.ruff.format]
quote-style = "double"
